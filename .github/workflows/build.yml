name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q SpeedWidget.zip
      - run: cd SpeedWidget && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedWidget-APK
          path: SpeedWidget/build/outputs/apk/debug/*.apk
